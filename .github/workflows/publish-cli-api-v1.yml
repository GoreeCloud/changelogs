name: Publish stable CLI/API v1.0.0
on:
  push:
    branches:
      - release/v1.0.0

permissions:
  contents: read

concurrency:
  group: goreecloud-changelogs-v1.0.0-publish
  cancel-in-progress: false

jobs:
  stable-matrix:
    name: Stable CLI/API gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install candidate
        run: python -m pip install .
      - name: Complete stdlib regression suite, including live-process API
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Re-run disposable restore interruption/rollback regressions
        run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_restore_crash_safety.py' -v

  distribution:
    name: Build and smoke-test stable wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm exact package release version
        run: |
          python - <<'PY'
          import pathlib, tomllib
          data = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          assert data['project']['version'] == '1.0.0'
          assert not data['project']['dependencies']
          PY
      - name: Build installable distribution
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Require exactly one 1.0.0 wheel and hash it
        run: |
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test -f dist/goreecloud_changelogs-1.0.0-py3-none-any.whl
          (cd dist && sha256sum *.whl > SHA256SUMS.txt)
      - name: Install candidate wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Exercise installed package away from repository checkout
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/scripts/wheel_smoke.py"
      - uses: actions/upload-artifact@v4
        with:
          name: goreecloud-changelogs-v1.0.0-wheel
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish immutable GitHub v1.0.0 release
    if: ${{ github.repository == 'GoreeCloud/changelogs' }}
    needs: [stable-matrix, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release branch is precisely green main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test "${GITHUB_REF}" = "refs/heads/release/v1.0.0"
          git fetch origin main
          test "${GITHUB_SHA}" = "$(git rev-parse FETCH_HEAD)"
          test "$(gh run list --workflow tests.yml --branch main --commit "${GITHUB_SHA}" --json conclusion --jq 'map(select(.conclusion == "success")) | length')" -ge 1
      - uses: actions/download-artifact@v4
        with:
          name: goreecloud-changelogs-v1.0.0-wheel
          path: dist
      - name: Verify checksums before publication
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          test -f goreecloud_changelogs-1.0.0-py3-none-any.whl
      - name: Publish once; never replace an existing release or tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::v1.0.0 GitHub release already exists; refusing overwrite"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin refs/tags/v1.0.0 >/dev/null 2>&1; then
            echo "::error::v1.0.0 tag already exists; refusing overwrite"
            exit 1
          fi
          gh release create v1.0.0 dist/*.whl dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "GoreeCloud Changelogs v1.0.0 — Stable CLI/API" \
            --notes-file docs/releases/v1.0.0.md \
            --latest
      - name: Verify release is public and non-prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.0.0 --repo "${GITHUB_REPOSITORY}" \
            --json tagName,isDraft,isPrerelease \
            --jq 'select(.tagName == "v1.0.0" and .isDraft == false and .isPrerelease == false) | .tagName' \
            | grep -Fx v1.0.0
