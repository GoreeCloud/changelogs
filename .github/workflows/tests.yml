name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Repeat backup concurrency and recovery tests
        run: |
          for run in 1 2 3; do
            python -W error::ResourceWarning -m unittest discover -s tests -p 'test_backup.py' -q
          done
