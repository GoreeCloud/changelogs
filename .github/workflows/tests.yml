name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Repeat backup concurrency and recovery tests
        run: |
          for run in 1 2 3; do
            python -W error::ResourceWarning -m unittest discover -s tests -p 'test_backup.py' -q
          done

  android-source:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile native Android reader
        run: gradle --project-dir android-app :app:assembleDebug --no-daemon --stacktrace

  web-js-syntax:
    name: Browser JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Parse hosted and loopback browser source
        run: |
          node --check src/goreecloud_changelogs/hosted_web/app.js
          node --check src/goreecloud_changelogs/web/app.js
      - name: Test hosted session and release navigation
        run: node --test tests/hosted_web_browser.test.cjs

  wheel-smoke:
    name: Source-absent wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build installable wheel
        run: python -m pip wheel --no-deps --wheel-dir "${RUNNER_TEMP}/wheels" .
      - name: Install built wheel
        run: python -m pip install --force-reinstall "${RUNNER_TEMP}"/wheels/*.whl
      - name: Verify installed package outside source tree
        run: |
          cd "${RUNNER_TEMP}"
          python "${GITHUB_WORKSPACE}/scripts/wheel_smoke.py"
